<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Maria Roswita Naibabu</title>
<style>
*{box-sizing:border-box}
body{background:royalblue;font-family:Arial;margin:0;padding:0}
.container{width:80%;margin:30px auto;padding:30px;background:#fff}
h1{color:darkcyan;text-align:center}
h2{color:darkred;margin-top:30px}
.identitas{width:100%}
.kolom-foto{vertical-align:top;padding-right:30px}
.foto-profil{width:200px;border:3px solid #00509e;padding:5px}
form{background:#f1f5f9;padding:20px;margin-top:20px;border:1px solid #ccc}
label{display:block;font-weight:bold;margin:10px 0 5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccc}
button{background:pink;color:#fff;padding:10px 20px;border:none;margin-right:10px;cursor:pointer}
button:hover{background:#003366}
.footer{text-align:center;color:#666;margin-top:30px}
@media(max-width:768px){
.container{width:94%;margin:10px auto;padding:15px}
.identitas,.identitas tbody,.identitas tr,.identitas td{display:block;width:100%}
.kolom-foto{width:100%;padding:0;text-align:center;margin-bottom:20px}
.foto-profil{width:150px}
button{width:100%;margin-bottom:10px}
}
</style>
</head>
<body>
<div class="container">
<h1>Curriculum Vitae</h1>
<table class="identitas">
<tr>
<td class="kolom-foto"><img src="foto.jpg" class="foto-profil"></td>
<td class="kolom-identitas">
<h3>Identitas Diri</h3>
<p><b>Nama Lengkap:</b> Maria Roswita Naibabu<br><b>NIM:</b> 51250089<br><b>Program Studi:</b> Teknologi Informasi</p>
</td>
</tr>
</table>

<h2>Profil Singkat</h2>
<p>Saya adalah mahasiswa Program Studi Teknologi Informasi Universitas Timor.</p>

<h2>Form Kontak</h2>
<form id="formKontak">
<label>Nama Lengkap</label><input type="text" id="nama" required>
<label>Email</label><input type="email" id="e-mail" required>
<label>No. Telepon</label><input type="tel" id="telepon">
<label>Bidang Minat</label>
<select id="minat"><option>Web Developer</option><option>UI/UX Design</option><option>Data Analisis</option></select>
<label>Pesan</label><textarea id="pesan" rows="4" required></textarea>
<br><br>
<button type="submit">Kirim ke WhatsApp</button><button type="reset">Reset</button>
</form>
<div class="footer"><p>&copy; 2026 Maria Roswita Naibabu</p></div>
</div>

<script>
const form=document.getElementById("formKontak");
form.addEventListener("submit",function(e){
e.preventDefault();
const nomorWhatsApp="6281339181944";
const nama=document.getElementById("nama").value;
const email=document.getElementById("e-mail").value;
const telepon=document.getElementById("telepon").value;
const minat=document.getElementById("minat").value;
const pesan=document.getElementById("pesan").value;
if(nama===""||pesan===""){alert("Nama dan Pesan wajib diisi!");return;}
const isiPesan=`Halo, saya menghubungi melalui website CV\n\nNama: ${nama}\nEmail: ${email}\nTelepon: ${telepon}\nMinat: ${minat}\n\nPesan:\n${pesan}`;
window.location.href="https://api.whatsapp.com/send?phone="+nomorWhatsApp+"&text="+encodeURIComponent(isiPesan);
});
</script>
</body>
</html>
